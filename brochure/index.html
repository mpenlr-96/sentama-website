<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentama Technologies - Corporate Brochure</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.sentama.in/brochure/" />
  <meta property="og:title" content="Sentama Technologies - Brochure" />
  <meta property="og:description" content="Flip through our interactive digital brochure." />
  <meta property="og:image" content="https://www.sentama.in/brochure/page1.webp" />

  <!-- PageFlip Engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Bar */
    header {
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.25rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tool-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: #334155;
      border-color: #64748b;
      color: #38bdf8;
    }

    .tool-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Interactive Viewport */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Zoom Canvas */
    .zoom-stage {
      transform-origin: center center;
      transition: transform 0.18s ease-out;
      will-change: transform;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .zoom-stage.is-zoomed {
      cursor: grab;
    }

    .zoom-stage.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    /* FlipBook Container */
    .flip-book {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 0, 0, 0.4);
      border-radius: 3px;
    }

    /* Every page soft paper styling */
    .page {
      background-color: #ffffff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    /* Bottom Control Bar */
    footer {
      height: 60px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      z-index: 50;
      flex-shrink: 0;
    }

    .nav-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.5rem 1.15rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #334155;
      border-color: #64748b;
      color: #38bdf8;
    }

    .page-info {
      font-size: 0.85rem;
      color: #94a3b8;
      min-width: 95px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .zoom-badge {
      display: none;
      position: absolute;
      top: 66px;
      background: rgba(2, 132, 199, 0.85);
      color: white;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-title"><a href="https://sentama.in/" style="text-decoration:none;color:#1b5fb7">Sentama Technologies</a></div>
    <div class="toolbar-actions">
      <button class="tool-btn" id="btnZoomOut" title="Zoom Out">&#8722;</button>
      <button class="tool-btn" id="btnZoomIn" title="Zoom In">&#43;</button>
      <button class="tool-btn active" id="btnReset" title="Reset Zoom">Reset</button>
      <button class="tool-btn" id="btnFullscreen" title="Fullscreen">&#x26F6;</button>
    </div>
  </header>

  <!-- Interactive Viewport -->
  <div class="viewport" id="viewport">
    <div class="zoom-badge" id="zoomBadge">Zoomed In (Drag to Pan)</div>
    <div class="zoom-stage" id="zoomStage">
      <div class="flip-book" id="book">
        <!-- Soft curling paper on every sheet using WebP -->
        <div class="page" data-density="soft"><img src="page1.webp" alt="Cover" /></div>
        <div class="page" data-density="soft"><img src="page2.webp" alt="Page 2" /></div>
        <div class="page" data-density="soft"><img src="page3.webp" alt="Page 3" /></div>
        <div class="page" data-density="soft"><img src="page4.webp" alt="Page 4" /></div>
        <div class="page" data-density="soft"><img src="page5.webp" alt="Page 5" /></div>
        <div class="page" data-density="soft"><img src="page6.webp" alt="Back Cover" /></div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <footer>
    <button class="nav-btn" id="btnPrev">&larr; Prev</button>
    <span class="page-info" id="pageNumber">Page 1 of 6</span>
    <button class="nav-btn" id="btnNext">Next &rarr;</button>
  </footer>

  <script>
    // --- 1. Paper Turn Sound Effect ---
    class FlipAudio {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      play() {
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          
          const bufferSize = this.ctx.sampleRate * 0.15;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(250, this.ctx.currentTime + 0.15);
          filter.Q.value = 2.5;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch (e) {}
      }
    }

    const sound = new FlipAudio();

    // --- 2. Dynamic Viewport Fit ---
    function getFitDimensions() {
      const isMobile = window.innerWidth < 768;
      const vWidth = window.innerWidth * (isMobile ? 0.92 : 0.86);
      const vHeight = (window.innerHeight - 114) * 0.88;
      const a4Ratio = 1.414;

      if (isMobile) {
        let width = vWidth;
        let height = width * a4Ratio;
        if (height > vHeight) {
          height = vHeight;
          width = height / a4Ratio;
        }
        return { width: Math.round(width), height: Math.round(height), isMobile: true };
      } else {
        let spreadW = vWidth;
        let height = (spreadW / 2) * a4Ratio;
        if (height > vHeight) {
          height = vHeight;
          spreadW = (height / a4Ratio) * 2;
        }
        return { width: Math.round(spreadW / 2), height: Math.round(height), isMobile: false };
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const bookEl = document.getElementById("book");
      const pageInfo = document.getElementById("pageNumber");
      const zoomStage = document.getElementById("zoomStage");
      const viewport = document.getElementById("viewport");
      const zoomBadge = document.getElementById("zoomBadge");
      const btnReset = document.getElementById("btnReset");

      const dims = getFitDimensions();

      const pageFlip = new St.PageFlip(bookEl, {
        width: dims.width,
        height: dims.height,
        size: "fixed",
        showCover: false,
        usePortrait: dims.isMobile,
        drawShadow: true,
        maxShadowOpacity: 0.7,
        flippingTime: 900,
        mobileScrollSupport: false,
        useMouseEvents: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      // --- 3. Zoom, Pan & Auto-Reset ---
      let zoomLevel = 1.0;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      function updateZoomTransform() {
        zoomStage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;

        if (zoomLevel > 1.0) {
          zoomStage.classList.add("is-zoomed");
          zoomBadge.style.display = "block";
          btnReset.classList.remove("active");
          btnReset.innerText = `Reset (${Math.round(zoomLevel * 100)}%)`;
        } else {
          zoomStage.classList.remove("is-zoomed");
          zoomBadge.style.display = "none";
          btnReset.classList.add("active");
          btnReset.innerText = "Reset";
          panX = 0;
          panY = 0;
        }
      }

      function resetZoom() {
        zoomLevel = 1.0;
        panX = 0;
        panY = 0;
        updateZoomTransform();
      }

      pageFlip.on("flip", (e) => {
        sound.play();
        resetZoom();
        const current = e.data + 1;
        const total = pageFlip.getPageCount();
        pageInfo.innerText = `Page ${current} of ${total}`;
      });

      document.getElementById("btnPrev").addEventListener("click", () => {
        resetZoom();
        pageFlip.flipPrev();
      });

      document.getElementById("btnNext").addEventListener("click", () => {
        resetZoom();
        pageFlip.flipNext();
      });

      document.getElementById("btnZoomIn").addEventListener("click", () => {
        if (zoomLevel < 2.5) {
          zoomLevel += 0.3;
          updateZoomTransform();
        }
      });

      document.getElementById("btnZoomOut").addEventListener("click", () => {
        if (zoomLevel > 1.0) {
          zoomLevel = Math.max(1.0, zoomLevel - 0.3);
          if (zoomLevel === 1.0) { panX = 0; panY = 0; }
          updateZoomTransform();
        }
      });

      btnReset.addEventListener("click", resetZoom);

      viewport.addEventListener("mousedown", (e) => {
        if (zoomLevel <= 1.0) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        zoomStage.classList.add("is-dragging");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateZoomTransform();
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
        zoomStage.classList.remove("is-dragging");
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          resetZoom();
          pageFlip.flipPrev();
        }
        if (e.key === "ArrowRight") {
          resetZoom();
          pageFlip.flipNext();
        }
        if (e.key === "Escape") {
          resetZoom();
        }
      });

      document.getElementById("btnFullscreen").addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    });
  </script>
</body>
</html>
