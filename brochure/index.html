<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentama Technologies - Corporate Brochure</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.sentama.in/brochure/" />
  <meta property="og:title" content="Sentama Technologies - Brochure" />
  <meta property="og:description" content="Explore our digital brochure with realistic page flipping." />
  <meta property="og:image" content="https://www.sentama.in/brochure/page1.png" />

  <!-- PageFlip Engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Brand Header */
    header {
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.5rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main Viewport Workspace */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    /* Zoom & Pan Wrapper */
    .zoom-stage {
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      will-change: transform;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .zoom-stage.is-zoomed {
      cursor: grab;
    }

    .zoom-stage.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    /* FlipBook Container */
    .flip-book {
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Book Centering States */
    .shift-center-cover {
      transform: translateX(-25%);
    }

    .shift-center-back {
      transform: translateX(25%);
    }

    .shift-center-spread {
      transform: translateX(0);
    }

    /* Individual Page Styling */
    .page {
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    /* Bottom Control Bar */
    footer {
      height: 64px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      z-index: 50;
      flex-shrink: 0;
    }

    .nav-btn, .tool-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .tool-btn:hover {
      background: #334155;
      border-color: #64748b;
      color: #38bdf8;
    }

    .tool-btn {
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
    }

    .page-info {
      font-size: 0.85rem;
      color: #94a3b8;
      min-width: 95px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Keyboard / Hint Helper */
    .hint-chip {
      position: absolute;
      bottom: 76px;
      background: rgba(0, 0, 0, 0.6);
      color: #cbd5e1;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-title">Sentama Technologies</div>
    <div class="toolbar-actions">
      <button class="tool-btn" id="btnZoomOut" title="Zoom Out">&#8722;</button>
      <button class="tool-btn" id="btnZoomReset" title="Reset Zoom">100%</button>
      <button class="tool-btn" id="btnZoomIn" title="Zoom In">&#43;</button>
      <button class="tool-btn" id="btnFullscreen" title="Toggle Fullscreen">&#x26F6;</button>
    </div>
  </header>

  <!-- Interactive Viewport -->
  <div class="viewport" id="viewport">
    <div class="zoom-stage" id="zoomStage">
      <div class="flip-book" id="book">
        <!-- Hard front cover for magazine weight -->
        <div class="page" data-density="hard"><img src="page1.png" alt="Cover" /></div>
        <!-- Soft, curved interior pages -->
        <div class="page" data-density="soft"><img src="page2.png" alt="Page 2" /></div>
        <div class="page" data-density="soft"><img src="page3.png" alt="Page 3" /></div>
        <div class="page" data-density="soft"><img src="page4.png" alt="Page 4" /></div>
        <div class="page" data-density="soft"><img src="page5.png" alt="Page 5" /></div>
        <!-- Hard back cover -->
        <div class="page" data-density="hard"><img src="page6.png" alt="Back Cover" /></div>
      </div>
    </div>
    <div class="hint-chip" id="hintChip">Click or drag page corner to flip &bull; Use arrows</div>
  </div>

  <!-- Bottom Bar Navigation -->
  <footer>
    <button class="nav-btn" id="btnPrev">&larr; Previous</button>
    <span class="page-info" id="pageNumber">Page 1 of 6</span>
    <button class="nav-btn" id="btnNext">Next &rarr;</button>
  </footer>

  <script>
    // --- 1. Realistic Page Flip Sound Generator (Web Audio API) ---
    class FlipAudio {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      play() {
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          
          const bufferSize = this.ctx.sampleRate * 0.12; // 120ms sound
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1; // Soft white noise
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.12);
          filter.Q.value = 3.0;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start();
        } catch (e) {
          // Audio blocked by browser policy until gesture
        }
      }
    }

    const sound = new FlipAudio();

    // --- 2. Fit to Screen Calculation ---
    function calculateFitDimensions() {
      const isMobile = window.innerWidth < 768;
      const vWidth = window.innerWidth * (isMobile ? 0.94 : 0.88);
      const vHeight = (window.innerHeight - 116) * 0.90; // Exclude header & footer
      const a4Ratio = 1.414; // Height to width ratio of standard brochure page

      if (isMobile) {
        let width = vWidth;
        let height = width * a4Ratio;
        if (height > vHeight) {
          height = vHeight;
          width = height / a4Ratio;
        }
        return { width: Math.round(width), height: Math.round(height), isMobile: true };
      } else {
        let spreadW = vWidth;
        let height = (spreadW / 2) * a4Ratio;
        if (height > vHeight) {
          height = vHeight;
          spreadW = (height / a4Ratio) * 2;
        }
        return { width: Math.round(spreadW / 2), height: Math.round(height), isMobile: false };
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const bookEl = document.getElementById("book");
      const pageInfo = document.getElementById("pageNumber");
      const zoomStage = document.getElementById("zoomStage");
      const viewport = document.getElementById("viewport");
      const dims = calculateFitDimensions();

      // Initialize St.PageFlip
      const pageFlip = new St.PageFlip(bookEl, {
        width: dims.width,
        height: dims.height,
        size: "fixed",
        showCover: true,
        usePortrait: dims.isMobile,
        drawShadow: true,
        maxShadowOpacity: 0.8,
        flippingTime: 850,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      // Center the book nicely depending on whether it's closed or open
      function updateAlignment(pageIndex) {
        if (dims.isMobile) {
          bookEl.className = "flip-book";
          return;
        }
        if (pageIndex === 0) {
          bookEl.className = "flip-book shift-center-cover";
        } else if (pageIndex >= pageFlip.getPageCount() - 1) {
          bookEl.className = "flip-book shift-center-back";
        } else {
          bookEl.className = "flip-book shift-center-spread";
        }
      }

      // Initial alignment on load
      updateAlignment(0);

      // Page flip events
      pageFlip.on("flip", (e) => {
        sound.play();
        const current = e.data + 1;
        const total = pageFlip.getPageCount();
        pageInfo.innerText = `Page ${current} of ${total}`;
        updateAlignment(e.data);
      });

      // Controls
      document.getElementById("btnPrev").addEventListener("click", () => pageFlip.flipPrev());
      document.getElementById("btnNext").addEventListener("click", () => pageFlip.flipNext());

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") pageFlip.flipPrev();
        if (e.key === "ArrowRight") pageFlip.flipNext();
      });

      // --- 3. Smooth Zoom & Pan Engine ---
      let zoomLevel = 1.0;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      function applyTransform() {
        zoomStage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        document.getElementById("btnZoomReset").innerText = `${Math.round(zoomLevel * 100)}%`;
        if (zoomLevel > 1) {
          zoomStage.classList.add("is-zoomed");
        } else {
          zoomStage.classList.remove("is-zoomed");
          panX = 0;
          panY = 0;
        }
      }

      document.getElementById("btnZoomIn").addEventListener("click", () => {
        if (zoomLevel < 2.5) {
          zoomLevel += 0.3;
          applyTransform();
        }
      });

      document.getElementById("btnZoomOut").addEventListener("click", () => {
        if (zoomLevel > 1.0) {
          zoomLevel = Math.max(1.0, zoomLevel - 0.3);
          if (zoomLevel === 1.0) { panX = 0; panY = 0; }
          applyTransform();
        }
      });

      document.getElementById("btnZoomReset").addEventListener("click", () => {
        zoomLevel = 1.0;
        panX = 0;
        panY = 0;
        applyTransform();
      });

      // Drag to pan when zoomed
      viewport.addEventListener("mousedown", (e) => {
        if (zoomLevel <= 1) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        zoomStage.classList.add("is-dragging");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
        zoomStage.classList.remove("is-dragging");
      });

      // Fullscreen
      document.getElementById("btnFullscreen").addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Hide instruction chip after 5 seconds
      setTimeout(() => {
        const hint = document.getElementById("hintChip");
        if (hint) hint.style.opacity = "0";
      }, 5000);
    });
  </script>
</body>
</html>
