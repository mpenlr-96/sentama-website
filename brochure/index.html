<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentama Brochure</title>

  <!-- Open Graph / Social Sharing Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.sentama.in/brochure/" />
  <meta property="og:title" content="Sentama - Corporate Brochure" />
  <meta property="og:description" content="Flip through our official company brochure." />
  <meta property="og:image" content="https://www.sentama.in/brochure/page1.png" />

  <!-- stPageFlip Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0.5rem;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .book-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      max-width: 100vw;
    }

    .flip-book {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      display: none; /* revealed once loaded */
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Bottom Control Bar */
    .controls {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-top: 1rem;
      z-index: 10;
    }

    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.5rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #334155;
      border-color: #475569;
    }

    .page-indicator {
      color: #94a3b8;
      font-size: 0.85rem;
      min-width: 90px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sentama Brochure</h1>
  </header>

  <div class="book-wrapper">
    <div class="flip-book" id="book">
      <!-- 6 PNG Pages -->
      <div class="page"><img src="page1.png" alt="Page 1 - Cover" /></div>
      <div class="page"><img src="page2.png" alt="Page 2" /></div>
      <div class="page"><img src="page3.png" alt="Page 3" /></div>
      <div class="page"><img src="page4.png" alt="Page 4" /></div>
      <div class="page"><img src="page5.png" alt="Page 5" /></div>
      <div class="page"><img src="page6.png" alt="Page 6 - Back Cover" /></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">&larr; Prev</button>
    <span class="page-indicator" id="pageIndicator">Page 1 of 6</span>
    <button class="btn" id="nextBtn">Next &rarr;</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bookEl = document.getElementById("book");
      const indicator = document.getElementById("pageIndicator");

      // Auto-detect aspect ratio & orientation
      const isMobile = window.innerWidth < 768;

      const pageFlip = new St.PageFlip(bookEl, {
        width: 550,          // Base page width
        height: 778,         // Base page height (standard brochure / A4 ratio)
        size: "stretch",
        minWidth: 280,
        maxWidth: 900,
        minHeight: 400,
        maxHeight: 1270,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: false,
        usePortrait: isMobile // Single page portrait on phone, double-page spread on desktop
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));
      bookEl.style.display = "block";

      // Navigation Buttons
      document.getElementById("prevBtn").addEventListener("click", () => {
        pageFlip.flipPrev();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        pageFlip.flipNext();
      });

      // Keyboard arrow navigation
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") pageFlip.flipPrev();
        if (e.key === "ArrowRight") pageFlip.flipNext();
      });

      // Update page counter text on flip
      pageFlip.on("flip", (e) => {
        const current = e.data + 1;
        const total = pageFlip.getPageCount();
        indicator.innerText = `Page ${current} of ${total}`;
      });
    });
  </script>
</body>
</html>
