                      <h3 className="font-bold text-[#090E17] text-sm mb-2">System Integrators & IT Consultants</h3>
                      <p className="text-xs text-slate-600 leading-relaxed mb-4">

            </section>

            {/* Operational Process & Interactive Calculator */}
            <section className="py-14 sm:py-20 bg-white border-b border-slate-200">
              <div className="max-w-7xl mx-auto px-4 sm:px-6">
                <div className="grid lg:grid-cols-12 gap-10 lg:gap-12 items-start">
                  
                  {/* Process Milestones */}

                          <span className="text-base text-[#163a7d] font-black">{clientCount} {clientCount === 1 ? 'Store' : 'Stores'}</span>

                        <input
