eckout & split payments",category:"retail_commerce",categoryLabel:"Retail & Commerce",hook:"Are slow checkout counters creating friction for impatient shoppers?",desc:"Engineered for high-volume cash counters. Supports high-speed barcode scanning, split billing (Cash, UPI, Cards, Store Credit), offline transactional queues, and thermal receipt printing.",features:["Sub-second keystroke response & multi-barcode format scanning","Split payment support (Cash, UPI QR, Credit Cards, Gift Cards)","100% offline billing queue with automatic cloud reconciliation","Direct thermal ESC/POS printer driver support without print dialogs","Cash drawer integration, shift handover tallies & day-end Z-reports"],bgImage:"https://images.unsplash.com/photo-1556742502-ec7c0e9f34b1?auto=format&fit=crop&w=1200&q=80",iconName:"CreditCard"},{id:"hotel",title:"Hotel & Property PMS",short:"Visual room grids & housekeeping status",category:"dining_hospitality",categoryLabel:"Hospitality & Lodging",hook:"Is managing room allocation, tariffs, and turn-around times causing chaos?",desc:"Intuitive interactive floor and room grid. Manage online reservations, walk-in check-ins, advance tariff security deposits, ID card records, and live housekeeping statuses to accelerate room turnover.",features:["Visual floor matrix with clean, dirty, occupied & reserved states","Govt-compliant guest ID scanning & digital registration card","Direct room service, minibar and laundry billing to room folio","Housekeeping mobile companion for instant room status release","Seasonal dynamic tariff engine with advance deposit tracking"],bgImage:"https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80",iconName:"Hotel"},{id:"hospital",title:"Healthcare & Clinic EMR",short:"Live token queues & integrated pharmacy",category:"healthcare_services",categoryLabel:"Healthcare & Wellness",hook:"Are patients burdened with long waiting queues and fragmented records?",desc:"End-to-end clinical workflow. Generates Electronic Medical Records (EMR), powers live digital token boards in waiting lounges, and routes doctor digital prescriptions straight to internal dispensary POS.",features:["Digital token queue with waiting room TV display integration","Electronic Health Records (EMR) with customizable clinical templates","Instant prescription dispatch to in-house dispensary inventory","Diagnostic lab test order tracking & report attachment","Appointment scheduling with patient WhatsApp token updates"],bgImage:"https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1200&q=80",iconName:"Activity"},{id:"sales",title:"Sales & Invoicing",short:"Quotations, dispatch & GST invoicing",category:"retail_commerce",categoryLabel:"Retail & Commerce",hook:"Losing time converting estimates into approved tax invoices?",desc:"Accelerate your revenue cycle. Convert proforma estimates into signed delivery notes and GST-compliant invoices with automatic tax splits, discount approvals, and balance ledgers.",features:["One-click conversion: Lead → Quotation → Proforma → Tax Invoice","Full statutory GST compliance with HSN/SAC code automated lookups","Customer credit ceiling check before invoice generation","Multi-currency support for international export consignments","Automated PDF invoice generation with digital signature & QR verification"],bgImage:"https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80",iconName:"FileText"},{id:"purchase",title:"Procurement & Vendors",short:"Purchase orders & GRN validation",category:"operations_supply",categoryLabel:"Operations & Supply",hook:"Finding it difficult to track supplier payment dues and goods deliveries?",desc:"Gain complete transparency over input costs. Manage purchase requisitions, match vendor bills against Goods Receipt Notes (GRN), track landed costs, and maintain balanced supplier ledgers.",features:["3-Way matching: Purchase Order vs Goods Receipt (GRN) vs Ven   function setupPartnerNav() {
    const desktopNav = document.querySelector('nav > div.hidden.md\\:flex');
    if (desktopNav && !document.getElementById('nav-link-partner')) {
      const btn = document.createElement('button');
      btn.id = 'nav-link-partner';
      btn.className = 'font-bold text-xs lg:text-[13px] tracking-wider uppercase transition-colors relative py-1 text-slate-600 hover:text-[#163a7d]';
      btn.textContent = 'Partner Network';
      btn.onclick = () => window.switchToPartner();
      desktopNav.appendChild(btn);
    }
  }

  window.switchToPartner = function() {
    ['view-home', 'view-services', 'view-smarthub'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });

    let pEl = document.getElementById('view-partner');
    if (!pEl) {
      const main = document.querySelector('main');
      if (main) {
        const wrap = document.createElement('div');
        wrap.innerHTML = getPartnerHTML();
        pEl = wrap.firstElementChild;
        const contactSec = document.getElementById('contact-section');
        if (contactSec) main.insertBefore(pEl, contactSec);
        else main.appendChild(pEl);
      }
    } else {
      pEl.style.display = 'block';
    }

    // Highlight menu
    document.querySelectorAll('nav > div.hidden.md\\:flex button').forEach(b => {
      b.className = 'font-bold text-xs lg:text-[13px] tracking-wider uppercase transition-colors relative py-1 text-slate-600 hover:text-[#163a7d]';
      const ind = b.querySelector('span');
      if (ind) ind.remove();
    });
    const pBtn = document.getElementById('nav-link-partner');
    if (pBtn) {
      pBtn.className = 'font-bold text-xs lg:text-[13px] tracking-wider uppercase transition-colors relative py-1 text-[#163a7d]';
      const indicator = document.createElement('span');
      indicator.className = 'absolute bottom-0 left-0 w-full h-0.5 bg-[#67c80f] rounded-full';
      pBtn.appendChild(indicator);
    }

    // Bind Dynamic Yearly Calculator
    const slider = document.getElementById('pt-slider');
    const selectRate = document.getElementById('pt-plan-rate');
    const selectMargin = document.getElementById('pt-partner-margin');
    const txtCount = document.getElementById('pt-clients-val');
    const txtAnn = document.getElementById('pt-annual-num');
    const txtMon = document.getElementById('pt-monthly-num');
    const txtPerClient = document.getElementById('pt-per-client');

    function updateEarnings() {
      if (!slider || !selectRate || !selectMargin) return;

      const count = parseInt(slider.value, 10);
      const annualPlanPrice = parseFloat(selectRate.value); // Yearly plan price
      const marginPct = parseFloat(selectMargin.value);     // Margin fraction

      // Yearly partner margin per client
      const annualMarginPerClient = Math.round(annualPlanPrice * marginPct);
      // Total yearly earnings across all active clients
      const totalAnnual = annualMarginPerClient * count;
      // Monthly cashflow equivalent
      const totalMonthly = Math.round(totalAnnual / 12);

      txtCount.textContent = count + (count === 1 ? ' Account' : ' Accounts');
      txtAnn.textContent = '₹ ' + totalAnnual.toLocaleString('en-IN');
      txtMon.textContent = '₹ ' + totalMonthly.toLocaleString('en-IN') + ' / mo';
      
      if (txtPerClient) {
        txtPerClient.textContent = '₹ ' + annualMarginPerClient.toLocaleString('en-IN') + ' / client / yr';
      }
    }

    if (slider && selectRate && selectMargin) {
      slider.oninput = updateEarnings;
      selectRate.onchange = updateEarnings;
      selectMargin.onchange = updateEarnings;
      updateEarnings();
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function bindOriginalTabs() {
    ['nav-link-home', 'nav-link-services', 'nav-link-smarthub', 'brand-logo-btn'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('click', () => {
          const pEl = document.getElementById('view-partner');
          if (pEl) pEl.style.display = 'none';
          const pBtn = document.getElementById('nav-link-partner');
          if (pBtn) {
            pBtn.className = 'font-bold text-xs lg:text-[13px] tracking-wider uppercase transition-colors relative py-1 text-slate-600 hover:text-[#163a7d]';
            const ind = pBtn.querySelector('span');
            if (ind) ind.remove();
          }
        });
      }
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    setupPartnerNav();
    bindOriginalTabs();
    const obs = new MutationObserver(() => {
      setupPartnerNav();
      bindOriginalTabs();
    });
    obs.observe(document.body, { childList: true, subtree: true });
  });
})();
</script>
